  </ellipse>

  <g transform="translate(100,174)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.03 0.97;1 1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;0;-3;3;-1.5;0;0" keyTimes="0;0.72;0.77;0.82;0.87;0.92;1" dur="7s" repeatCount="indefinite"/>

        <path d="M0,0 C-48,0 -54,-50 -48,-76 C-40,-106 -20,-122 0,-122 C20,-122 40,-106 48,-76 C54,-50 48,0 0,0 Z"
              fill="#FFF4E6" stroke="#5B4036" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="-22" cy="-92" rx="7" ry="13" fill="#FFFFFF" opacity="0.8" transform="rotate(-22 -22 -92)"/>

        <circle cx="24" cy="-98" r="5.5" fill="#FFD7C4"/>
        <circle cx="31" cy="-30" r="8" fill="#D3ECD6"/>
        <circle cx="-33" cy="-26" r="5" fill="#FFD7C4"/>
        <circle cx="38" cy="-62" r="3.5" fill="#D3ECD6"/>

        <ellipse cx="-25" cy="-47" rx="9" ry="5.5" fill="#FFAEB6" opacity="0.8" filter="url(#soft)"/>
        <ellipse cx="25" cy="-47" rx="9" ry="5.5" fill="#FFAEB6" opacity="0.8" filter="url(#soft)"/>

        <ellipse cx="-13" cy="-58" rx="3.8" ry="4.8" fill="#3E2C26">
          <animate attributeName="ry" values="4.8;4.8;0.5;4.8;4.8" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="13" cy="-58" rx="3.8" ry="4.8" fill="#3E2C26">
          <animate attributeName="ry" values="4.8;4.8;0.5;4.8;4.8" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="-11.8" cy="-59.6" r="1.3" fill="#FFFFFF">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14.2" cy="-59.6" r="1.3" fill="#FFFFFF">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4.2s" repeatCount="indefinite"/>
