<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Nudgling stage 1: cracked egg with a sprout peeking out. SMIL only -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="178" rx="40" ry="6.5" fill="#5B4036" opacity="0.12">
    <animate attributeName="rx" values="40;36;40" dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
  </ellipse>

  <g transform="translate(100,174)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.035 0.965;1 1" dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <g>
        <!-- livelier wobble than stage 0 -->
        <animateTransform attributeName="transform" type="rotate" values="0;0;-5;5;-4;3;0;0" keyTimes="0;0.6;0.66;0.72;0.78;0.84;0.9;1" dur="4.5s" repeatCount="indefinite"/>

        <path d="M0,0 C-48,0 -54,-50 -48,-76 C-40,-106 -20,-122 0,-122 C20,-122 40,-106 48,-76 C54,-50 48,0 0,0 Z"
              fill="#FFF4E6" stroke="#5B4036" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="-22" cy="-92" rx="7" ry="13" fill="#FFFFFF" opacity="0.8" transform="rotate(-22 -22 -92)"/>

        <circle cx="31" cy="-30" r="8" fill="#D3ECD6"/>
        <circle cx="-33" cy="-26" r="5" fill="#FFD7C4"/>
        <circle cx="38" cy="-62" r="3.5" fill="#D3ECD6"/>

        <!-- crack across the top -->
        <path d="M-30,-108 L-20,-98 L-10,-108 L0,-97 L10,-108 L20,-98 L30,-108"
              fill="none" stroke="#5B4036" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24,-100 L30,-90" fill="none" stroke="#5B4036" stroke-width="2.5" stroke-linecap="round"/>

        <!-- sprout pushing through the crack -->
        <g transform="translate(0,-110)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
            <path d="M0,0 Q1,-10 0,-20" fill="none" stroke="#5B4036" stroke-width="3" stroke-linecap="round"/>
            <path d="M0,-18 C-6,-28 -18,-28 -20,-20 C-13,-14 -5,-14 0,-18 Z" fill="#B5E0A8" stroke="#5B4036" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M0,-20 C6,-32 20,-33 23,-24 C16,-16 6,-15 0,-20 Z" fill="#B5E0A8" stroke="#5B4036" stroke-width="2.5" stroke-linejoin="round"/>
          </g>
        </g>

        <ellipse cx="-25" cy="-47" rx="9" ry="5.5" fill="#FFAEB6" opacity="0.85" filter="url(#soft)"/>
        <ellipse cx="25" cy="-47" rx="9" ry="5.5" fill="#FFAEB6" opacity="0.85" filter="url(#soft)"/>

        <ellipse cx="-13" cy="-58" rx="4" ry="5" fill="#3E2C26">
          <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.9;0.93;0.96;1" dur="3.6s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="13" cy="-58" rx="4" ry="5" fill="#3E2C26">
          <animate attributeName="ry" values="5;5;0.5;5;5" keyTimes="0;0.9;0.93;0.96;1" dur="3.6s" repeatCount="indefinite"/>
        </ellipse>
        <circle cx="-11.6" cy="-59.8" r="1.5" fill="#FFFFFF">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="14.4" cy="-59.8" r="1.5" fill="#FFFFFF">
          <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
