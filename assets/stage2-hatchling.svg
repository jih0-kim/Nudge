<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Nudgling stage 2: hatchling, a mochi blob with a sprout, sitting in the lower shell. SMIL only -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <ellipse cx="100" cy="178" rx="44" ry="6.5" fill="#5B4036" opacity="0.12"/>

  <g transform="translate(100,174)">
    <!-- body bobs up and down -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>

      <!-- sprout -->
      <g transform="translate(0,-110)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="2.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
          <path d="M0,2 Q1,-9 0,-18" fill="none" stroke="#5B4036" stroke-width="3" stroke-linecap="round"/>
          <path d="M0,-16 C-7,-27 -20,-27 -22,-18 C-14,-11 -5,-11 0,-16 Z" fill="#B5E0A8" stroke="#5B4036" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M0,-18 C7,-31 22,-32 25,-22 C17,-14 6,-13 0,-18 Z" fill="#B5E0A8" stroke="#5B4036" stroke-width="2.5" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- mochi body (bottom hidden by shell) -->
      <path d="M-40,-38 C-46,-80 -28,-110 0,-110 C28,-110 46,-80 40,-38 Z"
            fill="#FFFDF8" stroke="#5B4036" stroke-width="3.5" stroke-linejoin="round"/>
      <ellipse cx="-20" cy="-92" rx="7" ry="10" fill="#FFFFFF" opacity="0.9" transform="rotate(-25 -20 -92)"/>

      <ellipse cx="-24" cy="-68" rx="9.5" ry="6" fill="#FFAEB6" opacity="0.85" filter="url(#soft)"/>
      <ellipse cx="24" cy="-68" rx="9.5" ry="6" fill="#FFAEB6" opacity="0.85" filter="url(#soft)"/>

      <ellipse cx="-13" cy="-79" rx="4.2" ry="5.2" fill="#3E2C26">
        <animate attributeName="ry" values="5.2;5.2;0.5;5.2;5.2;0.5;5.2;5.2" keyTimes="0;0.84;0.86;0.88;0.9;0.92;0.94;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="13" cy="-79" rx="4.2" ry="5.2" fill="#3E2C26">
        <animate attributeName="ry" values="5.2;5.2;0.5;5.2;5.2;0.5;5.2;5.2" keyTimes="0;0.84;0.86;0.88;0.9;0.92;0.94;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="-11.5" cy="-81" r="1.6" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;1;0;1;1;0;1;1" keyTimes="0;0.84;0.86;0.88;0.9;0.92;0.94;1" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="14.5" cy="-81" r="1.6" fill="#FFFFFF">
        <animate attributeName="opacity" values="1;1;0;1;1;0;1;1" keyTimes="0;0.84;0.86;0.88;0.9;0.92;0.94;1" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- lower shell -->
    <path d="M-50,-58 L-38,-47 L-26,-59 L-13,-48 L0,-60 L13,-48 L26,-59 L38,-47 L50,-58 C54,-30 44,0 0,0 C-44,0 -54,-30 -50,-58 Z"
          fill="#FFF4E6" stroke="#5B4036" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="30" cy="-24" r="7" fill="#D3ECD6"/>
    <circle cx="-31" cy="-22" r="4.5" fill="#FFD7C4"/>
    <circle cx="-8" cy="-14" r="3" fill="#D3ECD6"/>

    <!-- tiny paws on the shell rim -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -1.5;0 0" dur="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <ellipse cx="-28" cy="-53" rx="8" ry="6" fill="#FFFDF8" stroke="#5B4036" stroke-width="3"/>
      <ellipse cx="28" cy="-53" rx="8" ry="6" fill="#FFFDF8" stroke="#5B4036" stroke-width="3"/>
    </g>
  </g>
</svg>
